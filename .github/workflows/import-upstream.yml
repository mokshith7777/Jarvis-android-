name: Integrate JARVIS Android foundation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-upstream.yml

permissions:
  contents: write

concurrency:
  group: jarvis-upstream-import
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Integrate upstream source and history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp README.md /tmp/jarvis-project-readme.md
          cp LICENSE /tmp/jarvis-project-license
          git remote add upstream https://github.com/AbuZar-Ansarii/Jarvis.git
          git fetch upstream master
          git merge --allow-unrelated-histories --no-commit -X theirs upstream/master || true
          cp /tmp/jarvis-project-readme.md README.md
          cp /tmp/jarvis-project-license LICENSE
          if git ls-files -u | grep -q .; then
            git checkout --theirs -- .gitignore || true
            git add -A
          fi
          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Integrate JARVIS Android foundation and upstream history"
          else
            echo "No merge was created; upstream may already be integrated."
          fi

      - name: Rebase on the latest project commit and push
        run: |
          git fetch origin main
          git rebase --rebase-merges origin/main
          git push origin HEAD:main