name: JARVIS PRO Android Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main, jarvis-pro-v2]
  push:
    branches: [main, jarvis-pro-v2, 'fix/**']
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "assets/**"
      - "termux_worker/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: jarvis-pro-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate and commit v3.3 launcher icons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 .github/scripts/generate_brand_icons.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/JARVIS_PRO_v3.3_Launcher_Icon_512.png android/app/src/main/res/mipmap-*
          if ! git diff --cached --quiet; then
            git commit -m "Generate JARVIS PRO v3.3 launcher icons"
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate missing Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="9.3.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          # Bootstrap the wrapper in an isolated empty project. Loading the Android
          # settings.gradle.kts here fails because Flutter has not generated
          # android/local.properties yet.
          mkdir -p /tmp/jarvis-wrapper-bootstrap
          cd /tmp/jarvis-wrapper-bootstrap
          printf '%s\n' "rootProject.name='jarvis-wrapper-bootstrap'" > settings.gradle
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type all
          mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/android/gradle/wrapper/"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          test -s "$GITHUB_WORKSPACE/android/gradlew"
          test -s "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit dependency lockfile updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "Sync Flutter dependency lockfile"
            git push origin HEAD:main
          fi

      - name: Validate Termux worker syntax
        run: python3 -m py_compile termux_worker/jarvis_worker.py

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK identity and signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          APP_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          PUBSPEC_VERSION_LINE="$(grep '^version:' pubspec.yaml)"
          PUBSPEC_VERSION="${PUBSPEC_VERSION_LINE#version: }"
          PUBSPEC_CODE="${PUBSPEC_VERSION##*+}"
          PUBSPEC_VERSION="${PUBSPEC_VERSION%%+*}"
          test "$APP_ID" = "com.mokshith.jarvis.ai"
          test "$VERSION_NAME" = "$PUBSPEC_VERSION"
          test "$VERSION_CODE" = "$PUBSPEC_CODE"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          mkdir -p dist
          cp "$APK" "dist/JARVIS-PRO-v${VERSION_NAME}.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=JARVIS-PRO-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA256"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-pro-${{ steps.verify.outputs.version_name }}-verified-apk
          path: dist/JARVIS-PRO-v${{ steps.verify.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_NAME="${{ steps.verify.outputs.version_name }}"
          VERSION_CODE="${{ steps.verify.outputs.version_code }}"
          TAG="v${VERSION_NAME}"
          APK_NAME="${{ steps.verify.outputs.apk_name }}"
          NOTES="JARVIS PRO ${VERSION_NAME} (version code ${VERSION_CODE}). Local-first zero-mandatory-API-key AI. Termux worker is separately installed and started; social indexing is opt-in. SHA-256: ${{ steps.verify.outputs.sha256 }}. CI verifies Flutter analysis, tests, APK package identity and signature. Always-On microphone listening remains OFF by default; entering JARVIS mode alone does not start capture. Native one-shot recognizer teardown and media audio-focus protection are retained. CI APK uses Android debug signing; configure a private release key for production distribution."
          # Keep the release tag anchored to the exact source used by this build.
          BUILD_SHA="$(git rev-parse HEAD)"
          git tag -f "$TAG" "$BUILD_SHA"
          git push origin "refs/tags/${TAG}" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "JARVIS PRO ${VERSION_NAME}" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --title "JARVIS PRO ${VERSION_NAME}" --notes "$NOTES" --latest
          fi
          gh release upload "$TAG" "dist/${APK_NAME}" --clobber
