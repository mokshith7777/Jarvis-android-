name: JARVIS PRO Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, jarvis-pro-v2, 'fix/**']
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "assets/**"
      - "termux_worker/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-pro-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.verify.outputs.version_name }}
      version_code: ${{ steps.verify.outputs.version_code }}
      apk_name: ${{ steps.verify.outputs.apk_name }}
      sha256: ${{ steps.verify.outputs.sha256 }}
      release_signed: ${{ steps.signing.outputs.signed }}
      apk_signed: ${{ steps.verify.outputs.signed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate launcher icons for this build
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 .github/scripts/generate_brand_icons.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate missing Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="9.3.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          # Bootstrap the wrapper in an isolated empty project. Loading the Android
          # settings.gradle.kts here fails because Flutter has not generated
          # android/local.properties yet.
          mkdir -p /tmp/jarvis-wrapper-bootstrap
          cd /tmp/jarvis-wrapper-bootstrap
          printf '%s\n' "rootProject.name='jarvis-wrapper-bootstrap'" > settings.gradle
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type all
          mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/android/gradle/wrapper/"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          test -s "$GITHUB_WORKSPACE/android/gradlew"
          test -s "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Validate Termux worker syntax
        run: python3 -m py_compile termux_worker/jarvis_worker.py

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Configure release signing (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets missing; build will be unsigned and will not be published as a release."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          JARVIS_RELEASE_KEYSTORE_PATH: ${{ format('{0}/jarvis-release.jks', runner.temp) }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build installable debug APK when release key is not configured
        if: steps.signing.outputs.signed != 'true'
        run: flutter build apk --debug

      - name: Verify APK identity and signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            APK="build/app/outputs/flutter-apk/app-release.apk"
          else
            APK="build/app/outputs/flutter-apk/app-debug.apk"
          fi
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          APP_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          PUBSPEC_VERSION_LINE="$(grep '^version:' pubspec.yaml)"
          PUBSPEC_VERSION="${PUBSPEC_VERSION_LINE#version: }"
          PUBSPEC_CODE="${PUBSPEC_VERSION##*+}"
          PUBSPEC_VERSION="${PUBSPEC_VERSION%%+*}"
          test "$APP_ID" = "com.mokshith.jarvis.ai"
          test "$VERSION_NAME" = "$PUBSPEC_VERSION"
          test "$VERSION_CODE" = "$PUBSPEC_CODE"
          SIGNED="false"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          SIGNED="true"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          mkdir -p dist
          cp "$APK" "dist/JARVIS-PRO-v${VERSION_NAME}.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=JARVIS-PRO-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA256"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-pro-${{ steps.verify.outputs.version_name }}-verified-apk
          path: dist/JARVIS-PRO-v${{ steps.verify.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.release_signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v7
        with:
          name: jarvis-pro-${{ needs.build.outputs.version_name }}-verified-apk
          path: dist

      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          NOTES="JARVIS PRO ${VERSION_NAME} (version code ${VERSION_CODE}). APK is signed with the configured private release key. SHA-256: ${SHA256}. CI checks Flutter analysis, tests, package identity and APK signature."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "JARVIS PRO ${VERSION_NAME}" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "JARVIS PRO ${VERSION_NAME}" --notes "$NOTES" --latest
          fi
          gh release upload "$TAG" "dist/${APK_NAME}" --clobber
