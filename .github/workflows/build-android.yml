name: JARVIS PRO Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, jarvis-pro-v2, 'fix/**']
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "assets/**"
      - "termux_worker/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android.yml"
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: jarvis-pro-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.verify.outputs.version_name }}
      version_code: ${{ steps.verify.outputs.version_code }}
      apk_name: ${{ steps.verify.outputs.apk_name }}
      sha256: ${{ steps.verify.outputs.sha256 }}
      release_signed: ${{ steps.signing.outputs.signed }}
      apk_signed: ${{ steps.verify.outputs.signed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate launcher icons for this build
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 .github/scripts/generate_brand_icons.py

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify committed Gradle wrapper
        run: |
          test -s android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          cd android
          ./gradlew --version

      - name: Verify dependency lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Validate Termux worker syntax
        run: python3 -m py_compile termux_worker/jarvis_worker.py

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Configure release signing (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets missing; build will be unsigned and will not be published as a release."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          JARVIS_RELEASE_KEYSTORE_PATH: ${{ format('{0}/jarvis-release.jks', runner.temp) }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build installable debug APK when release key is not configured
        if: steps.signing.outputs.signed != 'true'
        run: flutter build apk --debug

      - name: Verify APK identity and signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            APK="build/app/outputs/flutter-apk/app-release.apk"
          else
            APK="build/app/outputs/flutter-apk/app-debug.apk"
          fi
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          APP_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          PUBSPEC_VERSION_LINE="$(grep '^version:' pubspec.yaml)"
          PUBSPEC_VERSION="${PUBSPEC_VERSION_LINE#version: }"
          PUBSPEC_CODE="${PUBSPEC_VERSION##*+}"
          PUBSPEC_VERSION="${PUBSPEC_VERSION%%+*}"
          test "$APP_ID" = "com.mokshith.jarvis.ai"
          test "$VERSION_NAME" = "$PUBSPEC_VERSION"
          test "$VERSION_CODE" = "$PUBSPEC_CODE"
          SIGNED="false"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          SIGNED="true"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          mkdir -p dist
          cp "$APK" "dist/JARVIS-PRO-v${VERSION_NAME}.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=JARVIS-PRO-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA256"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jarvis-pro-${{ steps.verify.outputs.version_name }}-verified-apk
          path: dist/JARVIS-PRO-v${{ steps.verify.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.release_signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jarvis-pro-${{ needs.build.outputs.version_name }}-verified-apk
          path: dist

      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != "v${VERSION_NAME}" ]]; then
            echo "Tag $TAG does not match APK version v${VERSION_NAME}."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Refusing to overwrite a published release."
            exit 1
          fi
          NOTES="$(cat <<EOF
          JARVIS PRO ${VERSION_NAME} (version code ${VERSION_CODE}).

          SHA-256: ${SHA256}

          Verification: Flutter analysis, tests, Termux worker syntax, package identity and APK signature passed in CI.

          ## Security & installation notice
          Experimental software. Review permissions and source before installing. Do not use with sensitive credentials or data. Review SECURITY.md for known risks. This APK is signed with the configured private release key.

          EOF
          )"
          gh release create "$TAG" "dist/${APK_NAME}" --target "$GITHUB_SHA" --title "JARVIS PRO ${VERSION_NAME}" --notes "$NOTES"
