name: JARVIS PRO Pull Request Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jarvis-pro-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify committed Gradle wrapper
        run: |
          test -s android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          cd android
          ./gradlew --version

      - name: Validate Termux worker syntax
        run: python3 -m py_compile termux_worker/jarvis_worker.py

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK (no release upload)
        run: flutter build apk --release
