name: jarvis_android
description: "JARVIS PRO: a voice-driven Android assistant with user-controlled workflows and native integrations."
publish_to: 'none'
version: 2.0.0+200

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  installed_apps: ^2.1.1
  url_launcher: ^6.3.0
  android_intent_plus: ^6.1.0
  flutter_contacts: ^2.3.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.0
  volume_controller: ^3.6.0
  screen_brightness: ^2.1.11
  shizuku_api: ^1.2.2
  share_plus: ^13.3.0
  intl: ^0.20.3
  flutter_overlay_window: ^0.5.0
  flutter_markdown_plus: ^1.0.12
  uuid: ^4.6.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/genie_logo.png
    - assets/images/
